{% extends "account/base.html" %}
{% load i18n %}

{% block title %}Пароль изменён{% endblock %}

{% block inner_content %}
<div class="auth-form">
    <div class="success-icon">
        <i class="fas fa-check-circle"></i>
    </div>
    
    <h1 class="auth-title">Пароль успешно изменён</h1>
    
    <div class="success-message">
        <p>Ваш пароль был успешно изменён.</p>
        <p>Теперь вы можете войти в систему с новым паролем.</p>
    </div>
    
    <a href="{% url 'account_login' %}" class="button auth-button">
        <i class="fas fa-sign-in-alt"></i> Войти в систему
    </a>
</div>
{% endblock %}
